name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  mirror-policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test mirror policy without network or credentials
        run: python3 scripts/test-mirror-gitlab.py
  runtimes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        run: echo "matrix=$(bash scripts/php-images.sh --matrix)" >> "$GITHUB_OUTPUT"
  quality:
    needs: runtimes
    name: PHP ${{ matrix.php }} quality checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.runtimes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Build development image
        run: docker compose build --build-arg 'PHP_IMAGE=${{ matrix.image }}' app
      - name: Install Composer dependencies
        run: docker compose run --rm --user "$(id -u):$(id -g)" -e COMPOSER_HOME=/tmp/composer app composer install --no-interaction --prefer-dist
      - name: Run quality suite
        run: docker compose run --rm --user "$(id -u):$(id -g)" -e COMPOSER_HOME=/tmp/composer app composer ci
      - name: Check release documentation and archive
        run: bash scripts/check-release.sh
